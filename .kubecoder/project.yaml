projects:
  root:
    description: >-
      DHCPApp monorepo — orchestration tooling (the suite runner), the shared
      Procfile.dev dev stack, and CI.
    # The build/deploy pipeline (Jenkinsfile). The repo has a second job,
    # AaC/DHCPApp, driven by Jenkinsfile.architecture — it validates the two
    # docs/architecture/*.yaml artifacts and publishes one `dhcpapp` producer.
    jenkins: Dnsmasq/DHCPApp
    setup: cexec modern-app uv sync --locked
    # The root's own Python, and the architecture models; backend/ and frontend/
    # lint themselves.
    lint:
      # The rule set and the Ruff version are pinned in the root pyproject.toml.
      - cexec modern-app uv run ruff check scripts tools
      # The two models AaC/DHCPApp validates (Jenkinsfile.architecture), the
      # backend's and the frontend's; arch-validate submits each file on its own.
      # It exits 0 valid, 1 invalid, 2 transport: a 2 is the architecture
      # service, not this repository.
      - "if ls backend/docs/architecture/*.yaml frontend/docs/architecture/*.yaml >/dev/null 2>&1; then cexec aac-tools arch-validate backend/docs/architecture/*.yaml frontend/docs/architecture/*.yaml; else echo 'No architecture model in backend/docs/architecture/ and frontend/docs/architecture/'; fi"
    # No `test:` here on purpose. The root project owns `run-suite`
    # (tools/suite_runner), which is CI's single entry point and runs the
    # backend and frontend suites itself — declaring it here would make
    # `kc project test` run both suites two extra times. The per-component
    # verbs below are those same two suites, once each. CI keeps using
    # `uv run run-suite` because it also needs the JUnit XML, the retries
    # and the ===SUITE_RESULT:=== markers CI parses.

  backend:
    description: >-
      Flask REST API — parses dnsmasq config and lease files, serves leases,
      pools and pool usage, and streams lease changes over SSE.
    setup: cexec modern-app uv sync --locked
    test: cexec modern-app uv run pytest
    # The same three checks backend/scripts/check.py runs, which is this
    # subproject's own convention. CI never runs them, so this verb is the
    # only thing that does.
    lint:
      - cexec modern-app uv run ruff check .
      - cexec modern-app uv run mypy .
      - cexec modern-app uv run vulture app/ vulture_whitelist.py --min-confidence 80

  frontend:
    description: >-
      React 19 + TanStack Router/Query SPA with a generated OpenAPI client;
      Playwright E2E suite that boots the backend per worker.
    setup:
      - cexec modern-app pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - cexec modern-app pnpm playwright install chromium
    # `pnpm build` also runs `pnpm check`; the lint verb below repeats it so the
    # gate stands on its own.
    build: cexec modern-app pnpm build
    test: cexec modern-app pnpm playwright test
    lint: cexec modern-app pnpm check
