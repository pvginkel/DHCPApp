# KubeCoder environment manifest for the DHCPApp monorepo.
#
# `modern-app` rather than `python` + `frontend`: the Playwright harness boots the
# Flask backend and the SSE gateway per worker (frontend/tests/support/process/servers.ts),
# so a single command needs both toolsets in the same container. `iac` and
# `aac-tools` are the deploy repo's, not this repo's — see the `repos:` entry below.
#
# No data-store sidecars: the backend reads dnsmasq lease and config files off
# disk, and the app has no database and no object store. Development and testing
# both default DNSMASQ_CONFIG_FILE_PATH to the sample tree the repo ships, so no
# .env and no `env:` block is needed here.

repos:
  # The AI workflow's spec repository, shared across every environment that
  # works on DHCPApp. Registered here so /dev:onboard finds it already cloned.
  - url: https://github.com/pvginkel/DHCPAppSpecs
    shared: true

  # The deploy repository. Its chart carries this app's manifests alongside
  # dnsmasq's own, and the Dnsmasq/DHCPApp build pins the two image tags into
  # config/prd/values.yaml for Argo CD to sync, so a change here and the change
  # that deploys it are read and made together. Its own .kubecoder/project.yaml
  # runs every verb through the `iac` and `aac-tools` sidecars declared below;
  # an ordinary (unshared) entry, cloned to /work/DnsmasqDeploy and committed
  # separately.
  - url: https://github.com/pvginkel/DnsmasqDeploy

  # The homelab's image repository. `dnsmasq/` is the image this app sits behind:
  # its `files/dhcp-script.sh` is what POSTs lease changes to the app's
  # /internal/notify-lease-change, so that contract's two ends are changed
  # together (ANS-131). `dnsmasq/` is a Dockerfile-only directory and declares no
  # gate; the two gates its project.yaml does declare (backup-server's Go suite,
  # the architecture artifacts) are nothing to do with this app, so no `go`
  # toolchain is added for them — `iac`, which the architecture one needs, is
  # already here for the deploy repo. An ordinary (unshared) entry, cloned to
  # /work/DockerImages and committed separately.
  - url: https://github.com/pvginkel/DockerImages

  # dnsmasq's own repo: the dnsmasq image, its config generator and management
  # API, and their tests, moving out of DockerImages (DA-3). Its images are pinned
  # into the same deploy repo as this app's. An ordinary (unshared) entry, cloned
  # to /work/Dnsmasq and committed separately.
  - url: https://github.com/pvginkel/Dnsmasq

# For the Dnsmasq repo's integration tests: they run its images as Jobs in the
# cluster, so testing a change before it is pushed needs images built here.
# DHCPApp's own Dockerfiles are built by Jenkins only.
imageBuilder: true

capabilities:
  github: rw

tools:
  - use: modern-app
  # Both are DnsmasqDeploy's: `iac` for its Helm chart and Terraform, `aac-tools`
  # for its architecture producer. Nothing in this repo uses either.
  - use: iac
  - use: aac-tools

ports:
  - name: frontend
    port: 3300
    type: http
    sslOffload: true
  - name: backend
    port: 3301
    type: http
  - name: sse-gateway
    port: 3302
    type: http
